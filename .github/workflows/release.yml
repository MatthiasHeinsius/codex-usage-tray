name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.401

      - name: Check tag matches application version
        shell: pwsh
        run: |
          $version = dotnet msbuild .\src\CodexUsageTray\CodexUsageTray.csproj -nologo -getProperty:Version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $version."
          }

      - name: Validate solution
        uses: ./.github/actions/validate

      - name: Publish portable executable
        run: >-
          dotnet publish .\src\CodexUsageTray\CodexUsageTray.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o .\artifacts\win-x64

      - name: Test release executable and write checksum
        shell: pwsh
        run: |
          $exe = Resolve-Path .\artifacts\win-x64\CodexUsageTray.exe
          $process = Start-Process -FilePath $exe -ArgumentList "--self-test" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Release self-test failed with exit code $($process.ExitCode)."
          }

          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  CodexUsageTray.exe" | Set-Content -LiteralPath .\artifacts\win-x64\SHA256SUMS.txt -Encoding ascii

      - name: Upload release artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-win-x64
          path: .\artifacts\win-x64
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-win-x64
          path: artifacts/win-x64

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/win-x64/CodexUsageTray.exe \
            artifacts/win-x64/LICENSE.txt \
            artifacts/win-x64/SHA256SUMS.txt \
            artifacts/win-x64/THIRD-PARTY-NOTICES.txt \
            --generate-notes \
            --fail-on-no-commits \
            --title "Codex Usage Tray $GITHUB_REF_NAME" \
            --verify-tag
