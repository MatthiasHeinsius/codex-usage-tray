name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require a release commit from main
        shell: pwsh
        run: |
          git merge-base --is-ancestor "$env:GITHUB_SHA" refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw 'Release tags must point to commits already merged into main.'
          }

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Check tag matches application version
        shell: pwsh
        run: |
          $version = dotnet msbuild .\src\CodexUsageTray\CodexUsageTray.csproj -nologo -getProperty:Version
          if ("v$version" -ne $env:GITHUB_REF_NAME) {
            throw "Tag $env:GITHUB_REF_NAME does not match project version $version."
          }

      - name: Validate solution
        uses: ./.github/actions/validate

      - name: Check bundled runtime is current
        shell: pwsh
        run: ./.github/scripts/check-runtime.ps1

      - name: Publish and test portable executable
        shell: pwsh
        run: .\build-release.ps1

      - name: Write release checksum
        shell: pwsh
        run: |
          $exe = Resolve-Path .\artifacts\win-x64\CodexUsageTray.exe
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  CodexUsageTray.exe" | Set-Content -LiteralPath .\artifacts\win-x64\SHA256SUMS.txt -Encoding ascii

      - name: Attest release executable
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: artifacts/win-x64/CodexUsageTray.exe

      - name: Upload release artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-win-x64
          path: .\artifacts\win-x64
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-win-x64
          path: artifacts/win-x64

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/win-x64/CodexUsageTray.exe \
            artifacts/win-x64/LICENSE.txt \
            artifacts/win-x64/SHA256SUMS.txt \
            artifacts/win-x64/THIRD-PARTY-NOTICES.txt \
            --generate-notes \
            --fail-on-no-commits \
            --title "Codex Usage Tray $GITHUB_REF_NAME" \
            --verify-tag
