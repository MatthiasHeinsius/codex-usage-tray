name: Build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Validate solution
        uses: ./.github/actions/validate

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish and test portable executable
        shell: pwsh
        run: .\build-release.ps1

      - name: Validate dependency snapshot generation
        shell: pwsh
        run: |
          ./.github/scripts/dependency-snapshot.ps1 -OutputPath "$env:RUNNER_TEMP/dependencies.json"
          ./.github/scripts/test-dependency-snapshot.ps1 -SnapshotPath "$env:RUNNER_TEMP/dependencies.json"

      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CodexUsageTray-win-x64
          path: .\artifacts\win-x64
          if-no-files-found: error
          retention-days: 7
