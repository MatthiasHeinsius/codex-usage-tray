name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.401

      - name: Restore
        run: dotnet restore .\CodexUsageTray.slnx

      - name: Build
        run: dotnet build .\CodexUsageTray.slnx -c Release --no-restore

      - name: Check formatting
        run: dotnet format .\CodexUsageTray.slnx --verify-no-changes --no-restore

      - name: Run tests
        run: >-
          dotnet test
          --solution .\CodexUsageTray.slnx
          -c Release
          --no-build
          --no-restore
          --results-directory .\TestResults
          --coverage
          --coverage-output-format cobertura
          --report-xunit-trx

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn

      - name: Run self-tests
        run: dotnet run --project .\src\CodexUsageTray\CodexUsageTray.csproj -c Release --no-build -- --self-test

      - name: Publish portable executable
        run: >-
          dotnet publish .\src\CodexUsageTray\CodexUsageTray.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o .\artifacts\win-x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: CodexUsageTray-win-x64
          path: .\artifacts\win-x64
          if-no-files-found: error
