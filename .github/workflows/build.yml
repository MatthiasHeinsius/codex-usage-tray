name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore .\CodexUsageTray.slnx

      - name: Build
        run: dotnet build .\CodexUsageTray.slnx -c Release --no-restore

      - name: Run self-tests
        run: dotnet run --project .\src\CodexUsageTray\CodexUsageTray.csproj -c Release --no-build -- --self-test

      - name: Publish portable executable
        run: >-
          dotnet publish .\src\CodexUsageTray\CodexUsageTray.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o .\artifacts\win-x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CodexUsageTray-win-x64
          path: .\artifacts\win-x64\CodexUsageTray.exe
          if-no-files-found: error
