name: Build

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Validate solution
        uses: ./.github/actions/validate

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn
          retention-days: 7

      - name: Publish and test portable executable
        shell: pwsh
        run: .\build-release.ps1

      - name: Validate dependency snapshot generation
        shell: pwsh
        run: ./.github/scripts/dependency-snapshot.ps1 -OutputPath "$env:RUNNER_TEMP/dependencies.json"

      - name: Upload build artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: CodexUsageTray-win-x64
          path: .\artifacts\win-x64
          if-no-files-found: error
          retention-days: 7
